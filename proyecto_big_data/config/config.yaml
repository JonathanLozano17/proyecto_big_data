# config/config.yaml
etl:
  source_files:
    datos_concesionario: "data/raw/datos_concesionario_raw.xlsx"
  
  target_schema: "concesionario"

database:
  host: "localhost"
  port: 5432
  name: "concesionario_db"
  user: "postgres"
  password: "1717"

validation:
  min_date: "2020-01-01"
  max_date: "2024-12-31"
  min_price: 1000
  max_price: 200000
  reject_future_dates: true
  
  required_columns:
    dim_cliente: ["id_cliente", "nombre"]
    hecho_ventas: ["id_venta", "fecha_venta", "precio_venta"]

logging:
  level: "INFO"
  format: "%(asctime)s - %(levelname)s - %(message)s"
  file: "logs/etl_concesionario.log"